paths:
  raw: data/raw

video_exts:
  - .mp4
  - .mkv
  - .avi
  - .mov
  - .webm
  - .flv

signature:
  hsv:
    scale: 0.5
    frame_step: 5
    h_bins: 8
    s_bins: 8
    v_bins: 8
  clip:
    frame_step: 10      # CLIP тяжёлый, берём реже
  dino:
    frame_step: 10

grouping:
  threshold:
    hsv: 0.6
    clip: 0.85
    dino: 0.85


  lookback: 5
  min_duration: 5.0
  k: 3.0

logging:
  level: INFO
  file: null          # указать путь позжк